[project]
name = "cs-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arize-phoenix-otel>=0.16.1",
    "fastapi>=0.136.0",
    "openai>=2.32.0",
    "openai-agents>=0.14.2",
    "openinference-instrumentation-openai-agents>=1.5.1",
    "pgvector>=0.3.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "redis>=7.4.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.44.0",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "arize-phoenix>=16.0.0",
    "docker>=7.1.0",
    "fakeredis>=2.35.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
relative_files = true
omit = [
    "tests/*"
]

[tool.coverage.xml]
output = "coverage.xml"
