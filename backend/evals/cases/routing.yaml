# Routing-only cases: verify Supervisor sends each message to the right domain agent.
# No tool assertions — just routing correctness.

- id: routing_greeting
  messages:
    - role: user
      content: "Hi there!"
  expected_agent: Supervisor

- id: routing_vague_help
  messages:
    - role: user
      content: "I need some help"
  expected_agent: Support

- id: routing_invoice_question
  messages:
    - role: user
      content: "Can I see my latest invoice?"
  expected_agent: Billing

- id: routing_subscription_query
