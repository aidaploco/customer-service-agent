# Billing agent cases: verify tool call patterns and response quality.

- id: billing_view_subscription
  messages:
    - role: user
      content: "What subscription plan do I have? My email is alice@acme.com"
  expected_agent: Billing
  expected_tools: [get_subscription]
  quality_prompt: "Response should mention the plan name, status, and next billing date."

- id: billing_view_invoices
  messages:
    - role: user
      content: "Can I see my recent invoices? Email is alice@acme.com"
  expected_agent: Billing
  expected_tools: [get_invoice_history]
  quality_prompt: "Response should list invoice IDs, dates, amounts, and status."

- id: billing_upgrade_plan
  messages:
    - role: user
      content: "I'd like to upgrade to the Business plan. My email is alice@acme.com"
  expected_agent: Billing
  expected_tools: [update_plan]
  quality_prompt: "Response should confirm the upgrade and mention the new plan details."

- id: billing_request_refund
  messages:
    - role: user
      content: "I was charged incorrectly on invoice INV-2026-004. Please refund it. Email is alice@acme.com"
  expected_agent: Billing
  expected_tools: [request_refund]
  quality_prompt: "Response should confirm the refund request and provide a reference or timeline."

- id: billing_cancel_subscription
  messages:
    - role: user
      content: "I want to cancel my subscription. Email is alice@acme.com, reason: switching to a competitor"
  expected_agent: Billing
  expected_tools: [cancel_subscription]
  quality_prompt: "Response should confirm the cancellation and mention any relevant details like effective date."

- id: billing_downgrade_plan
  messages:
    - role: user
      content: "I'd like to downgrade to the Starter plan. My email is alice@acme.com"
  expected_agent: Billing
  expected_tools: [update_plan]
  quality_prompt: "Response should confirm the downgrade and mention the new plan name."
