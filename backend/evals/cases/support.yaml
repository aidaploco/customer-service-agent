# Support agent cases: verify tool call patterns and response quality.

- id: support_check_system_status
  messages:
    - role: user
      content: "Is the API currently experiencing any issues?"
  expected_agent: Support
  expected_tools: [get_system_status]
  quality_prompt: "Response should describe the current system status clearly."

- id: support_create_ticket
  messages:
    - role: user
      content: "I'm getting a 500 error on POST /api/v1/events. Email is bob@example.com"
  expected_agent: Support
  expected_tools: [create_ticket]
  quality_prompt: "Response should confirm a ticket was created and provide the ticket ID."

- id: support_ticket_status
  messages:
    - role: user
      content: "What is the status of ticket BL-10001?"
  expected_agent: Support
  expected_tools: [get_ticket_status]
  quality_prompt: "Response should clearly state the ticket status and any relevant details."

- id: support_kb_search
  messages:
    - role: user
      content: "How do I configure webhook retries?"
  expected_agent: Support
  expected_tools: [search_knowledge_base]
  quality_prompt: "Response should provide actionable guidance on webhook configuration."

- id: support_api_integration
  messages:
    - role: user
      content: "I'm having trouble with the SDK integration, getting authentication errors"
  expected_agent: Support
  expected_tools: [search_knowledge_base]
  quality_prompt: "Response should provide relevant troubleshooting steps for authentication issues."

- id: support_unknown_ticket_id
  messages:
    - role: user
      content: "Can you check the status of ticket INC-2026-012?"
  expected_agent: Support
  expected_tools: [get_ticket_status]
  quality_prompt: >
    Ticket INC-2026-012 does not exist. Response must say it was not found and ask the customer
    to verify the reference number. Must use the exact ticket ID INC-2026-012 — must NOT invent
    an alternative ID like BL-2026-012 or modify the format. Must NOT say it cannot help.

- id: general_company_overview
  messages:
    - role: user
      content: "What does Brightloop do?"
  expected_agent: Support
  quality_prompt: "Response should accurately describe the company's product or mission."

- id: general_pricing_plans
  messages:
    - role: user
      content: "What are the different pricing tiers available?"
  expected_agent: Support
  quality_prompt: "Response should mention that multiple pricing tiers exist and include at least one concrete detail such as a price, discount, or trial offer."

- id: general_security_compliance
  messages:
    - role: user
      content: "Is Brightloop SOC 2 compliant?"
  expected_agent: Support
  quality_prompt: "Response should address security certifications or compliance posture."

- id: general_sla_question
  messages:
    - role: user
      content: "What does your SLA cover?"
  expected_agent: Support
  quality_prompt: "Response should describe SLA coverage — support response times, service credits, or uptime commitments based on available information."

- id: general_greeting
  messages:
    - role: user
      content: "Hello, I'm a new customer"
  expected_agent: Supervisor
  quality_prompt: "Response should be a warm, professional greeting that invites the customer to ask their question."

# A session already on Support must still reach Billing for account questions.
- id: support_hands_back_plan_question
  start_agent: Support
  messages:
    - role: user
      content: "What plan am I on? My email is alice@example.com"
  expected_agent: Billing
  expected_tools: [get_subscription]
  quality_prompt: "Response should state the customer's current plan from their account. It must NOT say it lacks access to account information."

- id: support_hands_back_invoice_question
  start_agent: Support
  messages:
    - role: user
      content: "Can you show me my latest invoices? Email is bob@example.org"
  expected_agent: Billing
  expected_tools: [get_invoice_history]
