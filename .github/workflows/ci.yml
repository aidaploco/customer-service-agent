name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Check linting
        run: uv run ruff check src tests

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      OPENAI_API_KEY: test-key-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        run: uv run pytest --tb=short --cov --cov-report=xml --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml

  evals:
    name: Evals
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: backend
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run evals
        id: run_evals
        run: uv run python -m evals --threshold 0.9 --output eval_report.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-report
          path: backend/eval_report.json

      - name: Comment eval results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'backend/eval_report.json';
            if (!fs.existsSync(reportPath)) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## ⚠️ Evals did not run\n\nThe eval report was not produced (evals may have crashed before completing).',
              });
              return;
            }
            const THRESHOLD = 0.9;
            const report = JSON.parse(fs.readFileSync(reportPath));
            const s = report.summary;
            const u = s.usage || {};
            const icon = s.pass_rate >= THRESHOLD ? '✅' : '❌';
            const cfg = Object.entries(report.config || {}).map(([k,v]) => `\`${v}\``).join(' · ');
            const cats = Object.entries(s.by_category || {})
              .map(([cat, v]) => `| ${cat} | ${v.passed}/${v.total} | ${(v.pass_rate*100).toFixed(0)}% |`)
              .join('\n');
            const tokens = u.total_tokens
              ? `\n**Tokens:** ${u.input_tokens.toLocaleString()} in / ${u.output_tokens.toLocaleString()} out`
              : '';
            const body = [
              `## ${icon} Evals: ${s.passed}/${s.total} passed (${(s.pass_rate*100).toFixed(1)}%)`,
              `**Models:** ${cfg}${tokens}`,
              '',
              '| Category | Passed | Rate |',
              '|---|---|---|',
              cats,
            ].join('\n');
            const marker = '<!-- eval-results -->';
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: marker + '\n' + body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: marker + '\n' + body,
              });
            }

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: false
